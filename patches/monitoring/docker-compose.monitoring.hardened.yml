# =============================================================================
# docker-compose.monitoring.hardened.yml — ban da sua cua
# app/InlaneWeb/docker-compose.monitoring.yml
#
# Khac biet so voi ban goc, moi dong tuong ung mot vi pham da do duoc:
#   - grafana chuyen tu 0.0.0.0:3000 ve 127.0.0.1:3000      ATTACK-SURFACE
#   - mat khau grafana lay tu bien moi truong                CREDENTIALS
#   - autoheal mount docker.sock o che do chi doc            ISOLATION
#   - promtail khong con chay bang root                      LEAST-PRIVILEGE
#   - moi dich vu co cap_drop: [ALL] va no-new-privileges     LEAST-PRIVILEGE
#   - moi dich vu co read_only kem tmpfs cho duong can ghi    LEAST-PRIVILEGE
#   - autoheal ghim phien ban thay cho :latest                SUPPLY-CHAIN
#   - them alertmanager va alert-sink                         chuoi phat hien
# =============================================================================
name: inlaneweb-monitoring

x-hardening: &hardening
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: always

services:
  loki:
    <<: *hardening
    image: grafana/loki:3.0.0
    container_name: ilfreight_loki
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
      - /loki/rules-temp
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./monitoring/loki/rules:/etc/loki/rules:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  promtail:
    <<: *hardening
    image: grafana/promtail:3.0.0
    container_name: ilfreight_promtail
    # Ban goc dat user: root. Nhom docker tren host cho phep doc socket ma
    # khong can root trong container.
    user: "10001:10001"
    group_add:
      - "${DOCKER_GID:-999}"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    <<: *hardening
    image: grafana/grafana:11.0.0
    container_name: ilfreight_grafana
    user: "472:472"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.27.0
    container_name: ilfreight_alertmanager
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./patches/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  alert-sink:
    <<: *hardening
    image: python:3.12-slim
    container_name: ilfreight_alert_sink
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ALERT_LOG: /tmp/lab-alerts.log
      ALERT_PORT: "9099"
    volumes:
      - ./patches/monitoring/alert-sink.py:/opt/alert-sink.py:ro
    command: ["python", "-I", "/opt/alert-sink.py"]
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9099/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  autoheal:
    <<: *hardening
    image: willfarrell/autoheal:1.2.0
    container_name: ilfreight_autoheal
    read_only: true
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"
      AUTOHEAL_START_PERIOD: "20"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "10"
    volumes:
      # Ban goc mount ghi duoc, tuong duong quyen root tren host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [labnet]

volumes:
  loki_data:
  grafana_data:
  alertmanager_data:

networks:
  labnet:
    name: inlaneweb_net
    external: true
