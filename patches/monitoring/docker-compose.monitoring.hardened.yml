# =============================================================================
# docker-compose.monitoring.hardened.yml — cum giam sat DA VA, mot goc thu muc.
#
# Khac ban dan trong patches/monitoring/: moi duong dan volume deu tinh tu
# app/InlaneWeb/ (mot goc duy nhat), va promtail/loki tro toi BAN VA chu khong
# phai ban cu:
#   promtail      -> monitoring/promtail/promtail-config.hardened.yml
#   loki rules    -> monitoring/loki/rules-hardened
#   alertmanager  -> monitoring/alertmanager/alertmanager.yml
#   alert-sink    -> monitoring/alert-sink/alert-sink.py
#
# Moi khac biet an toan so voi ban cu da ghi trong patches/monitoring/.
# =============================================================================
name: inlaneweb-monitoring

x-hardening: &hardening
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: always

services:
  loki:
    <<: *hardening
    image: grafana/loki:3.0.0
    container_name: ilfreight_loki
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./monitoring/loki/rules-hardened:/etc/loki/rules:ro
      - loki_data:/loki
      - type: tmpfs
        target: /loki/rules-temp
        tmpfs:
          mode: 0777
    command: -config.file=/etc/loki/local-config.yaml
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  promtail:
    <<: *hardening
    image: grafana/promtail:3.0.0
    container_name: ilfreight_promtail
    user: "10001:10001"
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./monitoring/promtail/promtail-config.hardened.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks: [labnet]

  grafana:
    <<: *hardening
    image: grafana/grafana:11.0.0
    container_name: ilfreight_grafana
    user: "472:472"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks: [labnet]

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.27.0
    container_name: ilfreight_alertmanager
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  alert-sink:
    <<: *hardening
    image: python:3.12-slim
    container_name: ilfreight_alert_sink
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ALERT_LOG: /tmp/lab-alerts.log
      ALERT_PORT: "9099"
    volumes:
      - ./monitoring/alert-sink/alert-sink.py:/opt/alert-sink.py:ro
    command: ["python", "-I", "/opt/alert-sink.py"]
    networks: [labnet]

volumes:
  loki_data:
  grafana_data:
  alertmanager_data:

networks:
  labnet:
    name: inlaneweb_net
    external: true
