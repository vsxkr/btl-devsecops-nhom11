license: Apache-2.0
summary: >-
  Compliance as Code cho thoi diem CHAY, doi chieu trang thai thuc te cua
  container voi cac yeu cau an toan toi thieu. Khac voi Policy as Code o cho
  Policy as Code doc TEP CAU HINH truoc khi trien khai, con profile nay doc
