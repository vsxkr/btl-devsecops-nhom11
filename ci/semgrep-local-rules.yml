rules:
  - id: php-hardcoded-db-password-fallback
    languages: [php]
    severity: ERROR
    message: >-
      Mot bi mat co gia tri du phong dang hang. Khi bien moi truong thieu, ung
      dung van khoi dong bang mot gia tri da cong khai, va cong quet bi mat
      khong phat hien duoc vi ban than bi mat khong nam trong kho ma nguon.
      Bat buoc lay bi mat tu moi truong va thoat som khi thieu.
    patterns:
      - pattern-either:
          - pattern: getenv($NAME) ?: $FALLBACK
          - pattern: getenv($NAME) ?? $FALLBACK
          - pattern: $_ENV[$NAME] ?: $FALLBACK
          - pattern: $_ENV[$NAME] ?? $FALLBACK
          - pattern: $_SERVER[$NAME] ?: $FALLBACK
          - pattern: $_SERVER[$NAME] ?? $FALLBACK
      - metavariable-regex:
          metavariable: $FALLBACK
          regex: ^['"].+['"]$
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 Identification and Authentication Failures"
      policy: CS-04
      presentation: configuration

  - id: compose-hardcoded-mysql-root-password
    languages: [yaml]
    severity: ERROR
    message: >-
      MYSQL_ROOT_PASSWORD duoc ghi thang trong Compose. Phai lay tu nguon quan
      ly bi mat.
    patterns:
      - pattern: |
          MYSQL_ROOT_PASSWORD: $PASSWORD
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: '^(?!["'']?\$\{)[A-Za-z0-9_!@#.$-]+$'
    paths:
      include:
        # Ban truoc chi liet ke "**/docker-compose.yml", nen hai tep thuc su
        # dung khi trien khai la docker-compose.prod.yml va
        # docker-compose.monitoring.yml deu nam ngoai pham vi kiem tra. Cong
        # bao dat trong khi chua he doc den cau hinh duoc trien khai.
        - "**/docker-compose*.yml"
        - "**/docker-compose*.yaml"
        - "**/compose*.yml"
        - "**/compose*.yaml"
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 Identification and Authentication Failures"
      policy: CS-02
      presentation: configuration
