# =============================================================================
# docker-compose.prod.yml — BAN VA
#
# Tep nay la cau hinh THUC SU dung khi trien khai. Ban truoc cua no khong nam
# trong pham vi kiem tra cua cong chinh sach, vi `paths.include` cua bo quy tac
# chi liet ke "**/docker-compose.yml". Cong bao dat trong khi chua he doc den
# tep nay. Phan tich o bao cao muc 4.5.
#
# Sau khi mo rong pham vi, Conftest do duoc 9 vi pham tren tep nay trong run
# 41810794218. Moi dong duoi day tuong ung mot vi pham da sua:
#
#   CREDENTIALS      MYSQL_ROOT_PASSWORD va DB_PASS lay tu bien moi truong,
#                    dang `${VAR:?}` nen Compose dung lai khi thieu bi mat
#   LEAST-PRIVILEGE  ung dung ket noi CSDL bang ilf_app thay cho root
#   LEAST-PRIVILEGE  cap_drop: [ALL] va security_opt no-new-privileges
#   LEAST-PRIVILEGE  read_only kem tmpfs cho dung duong can ghi
#   SUPPLY-CHAIN     the anh ghim theo phien ban thay cho :latest
#   ATTACK-SURFACE   cong web van buoc vao 127.0.0.1, CSDL khong cong bo cong
#
# Bi mat nam trong tep .env khong duoc commit. Xem .env.example.
# =============================================================================
name: inlaneweb-prod

x-hardening: &hardening
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: always

services:
  db:
    <<: *hardening
    image: ${INLANEWEB_DB_IMAGE:-ghcr.io/vsxkr/inlaneweb-db:1.0.0}
    container_name: ilfreight_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?can bien moi truong MYSQL_ROOT_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?can bien moi truong APP_DB_PASSWORD}
      MYSQL_ROOT_HOST: "localhost"
    # KHONG cong bo cong CSDL ra host: chi container web ket noi noi bo.
    networks:
      - labnet
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql
      - shared_files:/var/lib/mysql-files

  web:
    <<: *hardening
    image: ${INLANEWEB_IMAGE:-ghcr.io/vsxkr/inlaneweb:1.0.0}
    container_name: ilfreight_web
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Trong container Apache lang nghe 8080 de khong can dac quyen bind cong thap.
      - "127.0.0.1:8088:8080"
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DB_HOST: db
      DB_USER: ilf_app
      DB_PASS: ${APP_DB_PASSWORD:?can bien moi truong APP_DB_PASSWORD}
      DB_NAME: ilfreight
      OOB_HOST: ""
    networks:
      - labnet
    volumes:
      # Chi mount thu muc chia se de phuc vu tep tai len; ma nguon PHP nam trong anh.
      - shared_files:/var/www/html/files

networks:
  labnet:
    name: inlaneweb_net
    driver: bridge

volumes:
  db_data:
  shared_files:
