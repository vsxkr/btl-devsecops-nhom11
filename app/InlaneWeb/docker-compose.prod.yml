# ============================================================================
#  IlFreight Logistics — Production Compose for VPS
#  Sử dụng trực tiếp Image đã được kiểm định an toàn và đóng gói ở Stage 3 từ GHCR.
#  - KHÔNG cần mã nguồn PHP trên máy chủ VPS (Self-contained Image).
#  - Dữ liệu Database được bảo toàn 100% qua Docker Volume `db_data`.
# ============================================================================
name: inlaneweb-prod

services:
  db:
    image: ${INLANEWEB_DB_IMAGE:-ghcr.io/vsxkr/inlaneweb-db:latest}
    container_name: ilfreight_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
    networks:
      - labnet
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql
      - shared_files:/var/lib/mysql-files

  web:
    image: ${INLANEWEB_IMAGE:-ghcr.io/vsxkr/inlaneweb:latest}
    container_name: ilfreight_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: password
      DB_NAME: ilfreight
      OOB_HOST: ""
    networks:
      - labnet
    volumes:
      # Chỉ mount thư mục chia sẻ để phục vụ files tải lên; mã nguồn PHP nằm trong image
      - shared_files:/var/www/html/files

networks:
  labnet:
    name: inlaneweb_net
    driver: bridge

volumes:
  db_data:
  shared_files:
