<VirtualHost *:80>
    ServerAdmin admin@ilfreight.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        # Cho phep .htaccess (mod_rewrite) -> URL sach
        AllowOverride All
        Require all granted
    </Directory>

    # Định dạng Log lưu lượng HTTP JSON tương thích 100% với bộ phân tích Promtail & Loki
    # Ghi nhận toàn bộ Method, URI, Query String (chứa Attack Vectors), HTTP Status và thời gian phản hồi
    LogFormat "{\"source\":\"apache_http_traffic\",\"timestamp\":\"%{%Y-%m-%dT%H:%M:%S%z}t\",\"client_ip\":\"%a\",\"method\":\"%m\",\"uri\":\"%U\",\"query\":\"%q\",\"status\":%>s,\"bytes\":%B,\"duration_us\":%D,\"referer\":\"%{Referer}i\",\"user_agent\":\"%{User-Agent}i\"}" apache_json
    CustomLog ${APACHE_LOG_DIR}/access.log apache_json
    ErrorLog ${APACHE_LOG_DIR}/error.log
</VirtualHost>
