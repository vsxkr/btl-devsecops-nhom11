; ============================================================
;  BAN VA.  P4, GDPR Dieu 32.
;
;  Ban cu dat display_errors = On "co y de lo", nen moi loi SQL va PHP hien ra
;  front-end, du cho ky thuat Error-based SQL Injection. Ban cu cung dat
;  session.cookie_httponly = Off nen JavaScript doc duoc cookie phien.
;
;  Chi tiet loi tu nay chi nam trong nhat ky phia may chu, con client nhan mot
;  thong diep chung kem ma su kien (xem lib/db.php).
; ============================================================
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On

; An toan phien
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
; Bat khi chay sau TLS o production:
; session.cookie_secure = On
