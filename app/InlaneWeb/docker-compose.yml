# =============================================================================
# docker-compose.yml — BAN VA
#
# Thay doi so voi ban cu, moi dong tuong ung mot vi pham da do duoc bang
# conftest test ... --namespace compose:
#
#   CREDENTIALS      moi mat khau lay tu bien moi truong, khong con chuoi hang
#   LEAST-PRIVILEGE  ung dung ket noi CSDL bang ilf_app thay cho root
#   LEAST-PRIVILEGE  cap_drop: [ALL] va security_opt no-new-privileges
#   LEAST-PRIVILEGE  read_only kem tmpfs cho duong can ghi
#   LEAST-PRIVILEGE  user khong dac quyen cho ca hai dich vu
#   SUPPLY-CHAIN     the anh ghim theo phien ban thay cho :latest
#   ATTACK-SURFACE   cong web van buoc vao 127.0.0.1
#
# Mat khau nam trong tep .env khong duoc commit. Xem .env.example.
# =============================================================================
name: inlaneweb-dev

x-hardening: &hardening
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: always

services:
  db:
    <<: *hardening
    build:
      context: ./db
      args:
        VCS_REF: ${VCS_REF:-dev}
    image: inlaneweb-db:1.0.0
    container_name: ilfreight_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD}
    # KHONG cong bo cong CSDL ra host: chi container web ket noi noi bo.
    networks: [labnet]
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

  web:
    <<: *hardening
    build:
      context: ./web
      args:
        VCS_REF: ${VCS_REF:-dev}
    image: inlaneweb-web:1.0.0
    container_name: ilfreight_web
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Trong container Apache lang nghe 8080 de khong can dac quyen bind cong thap.
      - "127.0.0.1:8088:8080"
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DB_HOST: db
      DB_USER: ilf_app
      DB_PASS: ${APP_DB_PASSWORD}
      DB_NAME: ilfreight
    networks: [labnet]

volumes:
  db_data:

networks:
  labnet:
    name: inlaneweb_net
    driver: bridge
